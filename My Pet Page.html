<!DOCTYPE html>
<html>
    <head>
        <title>My Pet Page</title>
        <style>
            body {
                font-family:Arial, Helvetica, sans-serif;
                background-color: lightyellow;
                padding: 65px 30px 30px 30px;
                min-height: 1800px;
            }

            h1,h2 { 
                color:darkorange;

            }

            .top-bar {
                position: fixed;
                top:0;
                right:0;
                left:0;
                background-color: darkorange;
                color:white;
                padding:14px 20px;
            }

            .list-items {
                background-color:white;
                border:2px solid darkorange;
                padding:14px 20px;
                margin: 5px 0px;
            }

            .special-note {
                position:relative;
                left:30px;
                background-color:gold;
                padding:10px 20px;
            }

            .pet-card {
                position:relative;
                border:3px solid darkorange;
                background-color:white;
                padding:10px 20px;
            }

            .badge {
                position:absolute;
                top:8px;
                right:8px;
                background-color: forestgreen;
                color: white;
                padding:4px 8px;
            }

            .section-label {
                position:sticky;
                top:55px;
                background-color: darkorange;
                color:white;
                padding:10px 20px;
                margin:15px 0 8px;
            }

            
                

        </style>
    </head>
    <body>
        <div class="top-bar">My Pet Page- Buddy The Labrador </div>
            <h1>Meet Buddy!</h1>
    </body>
</html
